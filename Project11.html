<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROJECT 11</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Project 11">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B3A6B;--navy2:#2A4F8F;--gold:#C8972B;--gold2:#E8B84B;--lblue:#EBF0F8;--gray:#C8CDD8;--dgray:#4A4A4A;--bg:#F0F3F8;--white:#FFFFFF;--text:#1A1A2E;--red:#C62828;--amber:#F57C00;--green:#2E7D32;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .app-header{background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(27,58,107,0.3);}
  .header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;}
  .app-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--white);letter-spacing:1px;}
  .app-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
  .gold-bar{height:3px;background:var(--gold);}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .week-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(200,151,43,0.5);border-radius:6px;padding:5px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;color:var(--gold2);cursor:pointer;}
  .saved-tag{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--gold);letter-spacing:1px;}
  .tabs{display:flex;background:rgba(0,0,0,0.2);}
  .tab{flex:1;padding:9px 4px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,0.45);cursor:pointer;border-bottom:2.5px solid transparent;transition:all 0.15s;text-transform:uppercase;position:relative;}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .notif-badge{background:var(--red);color:var(--white);border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;margin-left:3px;vertical-align:middle;}
  .content{padding:10px;max-width:640px;margin:0 auto;}
  .card{background:var(--white);border-radius:10px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(27,58,107,0.1);}
  .card-header{background:var(--navy);padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;color:var(--white);text-transform:uppercase;text-align:center;}
  .card-body{padding:10px 12px;}
  .pri-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--lblue);}
  .pri-row:last-child{border-bottom:none;}
  .pri-dot{width:22px;height:22px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;color:var(--white);flex-shrink:0;}
  .pri-dot-sm{width:18px;height:18px;font-size:10px;}
  .plain-input{flex:1;border:none;border-bottom:1px solid var(--gray);padding:3px 2px;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);background:transparent;outline:none;}
  .area-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .metric-box{display:flex;flex-direction:column;gap:2px;}
  .metric-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:0.5px;text-align:center;}
  .metric-inp{border:none;border-bottom:2px solid var(--gold);padding:3px 0;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--navy);background:transparent;outline:none;width:100%;text-align:center;}
  .sc-table{width:100%;border-collapse:collapse;}
  .sc-table th{background:var(--navy);color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;padding:4px 3px;text-align:center;}
  .sc-table th.lft{text-align:left;}
  .sc-table td{padding:3px;border-bottom:1px solid var(--lblue);text-align:center;vertical-align:middle;}
  .sc-table tr:nth-child(even) td{background:var(--lblue);}
  .br-num{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--navy);font-weight:600;text-align:left;white-space:nowrap;}
  .br-name{font-size:10px;color:var(--dgray);text-align:left;white-space:nowrap;}
  .sc-inp{width:100%;border:none;background:transparent;text-align:center;font-family:'Barlow',sans-serif;font-size:11px;color:var(--text);outline:none;padding:1px 0;}
  .kra-th{background:var(--navy2)!important;}
  .kpi-th{background:var(--gold)!important;}
  .visit-ok{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--green);font-weight:700;}
  .visit-warn{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--amber);font-weight:700;}
  .visit-old{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--red);font-weight:700;}
  .visit-none{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--gray);}
  .alert-banner{background:#FFF3E0;border-left:4px solid var(--amber);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
  .alert-banner.urgent{background:#FFEBEE;border-left-color:var(--red);}
  .alert-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;color:var(--amber);letter-spacing:1px;text-transform:uppercase;}
  .alert-banner.urgent .alert-title{color:var(--red);}
  .alert-item{font-family:'Barlow',sans-serif;font-size:12px;color:var(--dgray);margin-top:3px;}
  .day-card{background:var(--white);border-radius:10px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 3px rgba(27,58,107,0.1);}
  .day-hdr{background:var(--lblue);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;}
  .day-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:var(--navy);letter-spacing:1px;}
  .type-btns{display:flex;gap:6px;}
  .type-btn{padding:3px 10px;border-radius:4px;border:1.5px solid var(--navy);background:transparent;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;color:var(--navy);cursor:pointer;}
  .type-btn.on{background:var(--navy);color:var(--white);}
  .day-body{padding:10px 12px;}
  .field{margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  .field>label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--gray);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:2px;}
  .field input,.field textarea{width:100%;border:none;border-bottom:1px solid var(--gray);padding:4px 0;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);background:transparent;outline:none;resize:none;}
  .task-list{display:flex;flex-direction:column;}
  .task-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--lblue);}
  .task-row:last-child{border-bottom:none;}
  .task-row:nth-child(even){background:var(--lblue);}
  .task-row input[type="checkbox"]{width:15px;height:15px;accent-color:var(--navy);flex-shrink:0;cursor:pointer;}
  .task-row input[type="text"]{flex:1;border:none;background:transparent;font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);outline:none;padding:2px 0;}
  .task-row.done-row{opacity:0.6;}
  .task-row.done-row input[type="text"]{text-decoration:line-through;}
  .time-slots{display:flex;flex-direction:column;}
  .time-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--lblue);}
  .time-row:nth-child(even){background:var(--lblue);}
  .time-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--dgray);width:50px;flex-shrink:0;}
  .time-row input{flex:1;border:none;background:transparent;font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);outline:none;padding:2px 0;}
  .dot-area{background-image:radial-gradient(circle,var(--gray) 1px,transparent 1px);background-size:12px 12px;padding:10px 12px;position:relative;}
  .dot-area textarea{width:100%;background:transparent;border:none;outline:none;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);resize:none;min-height:80px;}
  .notes-editor{width:100%;background:transparent;border:none;outline:none;font-family:'Barlow',sans-serif;font-size:14px;color:var(--text);min-height:120px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap;}
  .notes-editor:empty:before{content:attr(data-placeholder);color:var(--gray);pointer-events:none;}
  .notes-expand-btn{position:absolute;top:8px;right:10px;background:rgba(27,58,107,0.08);border:none;border-radius:4px;padding:3px 7px;font-size:14px;cursor:pointer;color:var(--navy);}
  .canvas-notepad{position:relative;width:100%;height:104px;overflow:auto;background-image:radial-gradient(circle,var(--gray) 1px,transparent 1px);background-size:12px 12px;padding:10px 12px;cursor:text;}
  .canvas-notepad-inner{position:relative;width:100%;min-height:84px;}
  .canvas-block{position:absolute;min-width:80px;max-width:280px;}
  .canvas-toolbar{display:flex;gap:3px;background:var(--navy);border-radius:6px;padding:3px 5px;margin-bottom:4px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
  .canvas-tb-btn{background:transparent;border:none;color:var(--white);font-size:13px;padding:3px 5px;border-radius:3px;cursor:pointer;font-family:'Barlow',sans-serif;line-height:1;}
  .canvas-tb-btn:active,.canvas-tb-btn.active{background:rgba(255,255,255,0.2);}
  .canvas-tb-sep{width:1px;background:rgba(255,255,255,0.2);margin:2px 2px;}
  .canvas-editor{background:transparent;border:none;outline:none;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);min-width:80px;max-width:260px;min-height:20px;line-height:1.6;word-wrap:break-word;cursor:text;}
  .canvas-editor:empty:before{content:'Type here...';color:var(--gray);pointer-events:none;}
  .canvas-block textarea{background:transparent;border:none;outline:none;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);resize:none;padding:2px 4px;overflow:hidden;min-height:20px;width:100%;line-height:1.5;}
  .canvas-block-del{position:absolute;top:-8px;right:-8px;background:var(--red);color:white;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .canvas-notepad-fs{position:fixed;top:60px;left:10px;right:10px;bottom:60px;z-index:1000;display:flex;flex-direction:column;background:var(--white);border-radius:12px;box-shadow:0 8px 40px rgba(27,58,107,0.35);overflow:hidden;}
  .canvas-fs-header{background:var(--navy);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .canvas-fs-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--white);letter-spacing:1px;}
  .canvas-fs-close{background:rgba(255,255,255,0.15);border:none;border-radius:6px;padding:6px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--white);cursor:pointer;}
  .canvas-fs-body{flex:1;overflow:auto;background-image:radial-gradient(circle,var(--gray) 1px,transparent 1px);background-size:18px 18px;position:relative;cursor:text;}
  .canvas-fs-inner{position:relative;width:100%;min-height:100%;}
  .notes-fullscreen{position:fixed;inset:0;z-index:300;background:var(--white);display:flex;flex-direction:column;}
  .notes-fs-header{background:var(--navy);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
  .notes-fs-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--white);letter-spacing:1px;text-transform:uppercase;}
  .notes-fs-close{background:rgba(255,255,255,0.15);border:none;border-radius:6px;padding:6px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--white);cursor:pointer;}
  .notes-fs-body{flex:1;overflow-y:auto;background-image:radial-gradient(circle,var(--gray) 1px,transparent 1px);background-size:18px 18px;padding:16px;}
  .notes-fs-editor{width:100%;height:100%;background:transparent;border:none;outline:none;font-family:'Barlow',sans-serif;font-size:15px;color:var(--text);line-height:1.8;word-wrap:break-word;white-space:pre-wrap;min-height:calc(100vh - 120px);}
  .notes-fs-editor:empty:before{content:attr(data-placeholder);color:var(--gray);}
  .eod-checks{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--lblue);flex-wrap:wrap;}
  .eod-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--dgray);}
  .pri-check{display:flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer;}
  .pri-check input{accent-color:var(--navy);width:14px;height:14px;}
  .eod-field{padding:8px 12px;border-bottom:1px solid var(--lblue);}
  .eod-field:last-child{border-bottom:none;}
  .eod-field label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--gray);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px;}
  .eod-field textarea{width:100%;border:none;border-bottom:1px solid var(--gray);padding:3px 0;font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);background:transparent;outline:none;resize:none;min-height:32px;}
  .monday-grid{display:grid;grid-template-columns:1fr 1fr;}
  .mon-task{display:flex;align-items:center;gap:6px;padding:9px 10px;border-right:1px solid var(--lblue);border-bottom:1px solid var(--lblue);cursor:pointer;}
  .mon-task:nth-child(2n){border-right:none;}
  .mon-task input{accent-color:var(--navy);width:14px;height:14px;flex-shrink:0;}
  .mon-task span{font-family:'Barlow',sans-serif;font-size:11px;color:var(--dgray);}
  .modal-bg{position:fixed;inset:0;background:rgba(27,58,107,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--white);border-radius:12px;padding:20px;width:100%;max-width:320px;max-height:80vh;overflow-y:auto;}
  .modal h3{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--navy);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
  .modal p{font-family:'Barlow',sans-serif;font-size:12px;color:var(--dgray);margin-bottom:10px;}
  .modal input[type="date"]{width:100%;border:1.5px solid var(--gray);border-radius:6px;padding:8px;font-family:'Barlow',sans-serif;font-size:14px;margin-bottom:12px;outline:none;}
  .modal-btns{display:flex;gap:8px;margin-top:12px;}
  .btn{flex:1;padding:9px;border-radius:6px;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;}
  .btn-p{background:var(--navy);color:var(--white);}
  .btn-s{background:var(--lblue);color:var(--navy);}
  .btn-gold{background:var(--gold);color:var(--white);}
  .today-date{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;color:var(--navy);letter-spacing:1px;}
  .today-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--gray);letter-spacing:2px;text-transform:uppercase;margin-top:1px;}
  .dor-block{background:var(--white);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(27,58,107,0.1);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dor-label{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;color:var(--navy);letter-spacing:1px;}
  .dor-sub{font-family:'Barlow',sans-serif;font-size:11px;color:var(--gray);margin-top:2px;}
  .dor-check{width:26px;height:26px;accent-color:var(--navy);cursor:pointer;flex-shrink:0;}
  .dor-done .dor-label{color:var(--green);}
  .dor-done .dor-sub{color:var(--green);}
  .section-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin:14px 0 6px 2px;}
  .call-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--lblue);}
  .call-row:last-child{border-bottom:none;}
  .call-branch{font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);}
  .call-days{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;}
  .call-due{background:#FFF3E0;color:var(--amber);}
  .call-overdue{background:#FFEBEE;color:var(--red);}
  .call-ok{background:#E8F5E9;color:var(--green);}
  .today-plan-row{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-bottom:1px solid var(--lblue);}
  .today-plan-row:last-child{border-bottom:none;}
  .today-plan-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--gray);letter-spacing:1px;text-transform:uppercase;width:55px;flex-shrink:0;padding-top:2px;}
  .today-plan-val{font-family:'Barlow',sans-serif;font-size:13px;color:var(--text);flex:1;}
  .monthly-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--lblue);background:#FFFBF0;}
  .monthly-row:last-child{border-bottom:none;}
  .monthly-row span{font-family:'Barlow',sans-serif;font-size:13px;color:var(--dgray);}
  .go-btn{background:var(--navy);color:var(--white);border:none;border-radius:6px;padding:5px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;cursor:pointer;letter-spacing:1px;white-space:nowrap;}
  .date-inp{border:none!important;border-bottom:1.5px solid var(--gold)!important;padding:4px 0!important;font-family:'Barlow',sans-serif!important;font-size:13px!important;background:transparent!important;outline:none!important;width:100%!important;}
  .chk-row{display:flex;align-items:center;gap:14px;}
  .chk-lbl{display:flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--navy);cursor:pointer;}
  .chk-lbl input{accent-color:var(--navy);width:14px;height:14px;}
  .cf-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--lblue);}
  .cf-item:last-child{border-bottom:none;}
  .cf-item input[type="checkbox"]{width:16px;height:16px;accent-color:var(--gold);flex-shrink:0;cursor:pointer;}
  .cf-tag{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;text-transform:uppercase;flex-shrink:0;}
  .cf-tag-pri{background:var(--gold);color:var(--white);}
  .cf-tag-call{background:var(--navy2);color:var(--white);}
  .cf-tag-task{background:var(--lblue);color:var(--navy);}
  .from-weekly{background:#F0F9F0;border-left:3px solid var(--green);border-radius:6px;padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .from-weekly-text{font-family:'Barlow',sans-serif;font-size:11px;color:var(--green);}
  .from-weekly button{background:var(--green);color:var(--white);border:none;border-radius:4px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;cursor:pointer;white-space:nowrap;}
  .daily-date-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .date-nav-btn{background:var(--lblue);border:none;border-radius:6px;padding:6px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--navy);cursor:pointer;}
  .date-display{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--navy);}

/* === PROJECT 11 CONCEPT-FAITHFUL UI REBUILD === */
:root{--navy:#0C275D;--navy2:#123A7A;--blue:#1768E5;--blue2:#0F58C7;--gold:#D89B0D;--gold2:#E7AF22;--lblue:#EEF5FF;--gray:#8B97AB;--dgray:#4F5D73;--bg:#F8FAFD;--white:#FFFFFF;--text:#12244B;--line:#DCE4EF;}
html,body,#root{background:var(--bg);}
body{font-family:'Barlow',sans-serif;color:var(--text);padding-bottom:24px;}
.app-header{background:transparent;position:sticky;top:0;z-index:100;padding:10px 14px 0;box-shadow:none;backdrop-filter:blur(14px);}

// ── MONTHLY RECURRING TASKS ──
// Payroll anchor: Monday April 27, 2026 — every other Monday from there
const PAYROLL_ANCHOR = '2026-04-27';
function isPayrollWeek(weekKey){
  const anchor=new Date(PAYROLL_ANCHOR+'T12:00:00');
  const week=new Date(weekKey+'T12:00:00');
  const diffWeeks=Math.round((week-anchor)/(7*24*60*60*1000));
  return diffWeeks%2===0;
}
function getWeekOfMonth(weekKey){
  const d=new Date(weekKey+'T12:00:00');
  const month=d.getMonth(), year=d.getFullYear();
  let count=0;
  for(let day=1;day<=d.getDate();day++){if(new Date(year,month,day).getDay()===1)count++;}
  const daysInMonth=new Date(year,month+1,0).getDate();
  // Last FULL week = last Monday where Saturday (Mon+5) is still in the same month
  let lastFullMonday=0;
  for(let day=daysInMonth;day>=1;day--){
    if(new Date(year,month,day).getDay()===1){
      if(day+5<=daysInMonth){lastFullMonday=day;break;}
    }
  }
  return{count,isLastFull:d.getDate()===lastFullMonday};
}
// EOM carry-over tasks: show from 1st of month until checked off
const EOM_CARRY_TASKS=[
  {key:'monthly_goals',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'rungoals'})),'Run & Send Monthly Goals')},
  {key:'eom_scorecard',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'eom'})),'Send EOM Scorecard')},
  {key:'loss_projections',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'loss'})),'Loss Projections')},
];
function getMonthlyTasks(weekKey){
  const{count,isLastFull}=getWeekOfMonth(weekKey);
  const tasks=[];
  // Check if this week contains the 1st of any month (handles weeks spanning month boundary)
  const weekStart=new Date(weekKey+'T12:00:00');
  let containsFirst=false;
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(d.getDate()+i);
    if(d.getDate()===1){containsFirst=true;break;}
  }
  if(containsFirst||count===1){
    tasks.push({key:'mileage',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'mileage'})),'Submit Mileage Reimbursement')});
    tasks.push({key:'expenses',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'expense'})),'Submit Expense Report')});
  }
  if(count===2)tasks.push({key:'supplies',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'supply'})),'Submit Supply Orders')});
  if(isPayrollWeek(weekKey))tasks.push({key:'payroll',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'approvepayroll'})),'Review & Approve Payroll')});
  if(isLastFull)tasks.push({key:'schedule',label:e(React.Fragment,null,e('span',{className:'task-mini-ico'},e(P11Icon,{type:'schedule'})),'Send Monthly Schedule Email')});
  return tasks;
}
const BASE_MON_TASKS=['Written-Off Accounts','Recovery Accounts','Weekly Scorecard','Week Planning'];
const METRIC_KEYS=['opb','cash','loss','hlOrg','hl3rd'];

// ── UTILS ──
function todayStr(){const d=new Date();const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function getWeekKey(date){
  const d=new Date(typeof date==='string'?date+'T12:00:00':date);
  const diff=d.getDate()-d.getDay()+(d.getDay()===0?-6:1);
  return new Date(d.setDate(diff)).toISOString().slice(0,10);
}
function fmtWeek(k){return new Date(k+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDate(s){if(!s)return null;return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDateLong(s){if(!s)return '';return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});}
function daysBetween(a,b){return Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/(1000*60*60*24));}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function getDow(dateStr){return new Date(dateStr+'T12:00:00').getDay();}

// ── STORAGE ──
// Cloud storage via /api/data — falls back to localStorage if offline

async function kvGet(key){
  try{
    const r=await fetch('/api/data?key='+encodeURIComponent(key));
    const d=await r.json();
    if(d.value===null||d.value===undefined)return null;
    // Unwrap any depth of JSON encoding
    let v=d.value;
    let attempts=0;
    while(typeof v==='string'&&attempts<10){
      try{const p=JSON.parse(v);v=p;attempts++;}catch(ex){break;}
    }
    return v;
  }catch(ex){}
  return null;
}
async function kvSet(key,value){
  // Always write localStorage first
  try{localStorage.setItem(key,JSON.stringify(value));}catch(ex){}
  // Then try cloud
  try{
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value:JSON.stringify(value)})});
  }catch(ex){}
}

// Week data
async function loadWeek(weekKey){
  let r=await kvGet('p11w_'+weekKey);
  if(r){
    if(typeof r==='string'){try{r=JSON.parse(r);}catch(ex){}}
  }
  if(r&&r.sc&&r.sc.area&&r.wk)return r;
  // Fall back to localStorage
  try{
    const ls=localStorage.getItem('p11w_'+weekKey);
    if(ls){const p=JSON.parse(ls);if(p&&p.sc&&p.sc.area&&p.wk)return p;}
  }catch(ex){}
  if(weekKey===SEED_WEEK_KEY)return JSON.parse(JSON.stringify(SEED_DATA));
  return makeDefaultWeek();
}
function saveWeek(weekKey,data){kvSet('p11w_'+weekKey,data);}

// Daily data
async function loadDay(dateStr){
  let r=await kvGet('p11d_'+dateStr);
  if(r){
    // Handle double-encoded strings
    if(typeof r==='string'){try{r=JSON.parse(r);}catch(ex){}}
    if(r&&typeof r==='object')return r;
  }
  try{
    const ls=localStorage.getItem('p11d_'+dateStr);
    if(ls){const p=JSON.parse(ls);if(p)return p;}
  }catch(ex){}
  return makeDefaultDay(dateStr);
}
function saveDay(dateStr,data){kvSet('p11d_'+dateStr,data);}

// Global data: visit history
async function getVisitHistory(){
  const r=await kvGet('p11g_visits');
  if(r)return r;
  try{const ls=localStorage.getItem('p11g_visits');return ls?JSON.parse(ls):{};}catch(ex){return {};}
}
async function recordVisit(branchName,dateStr){
  if(!branchName||!dateStr)return;
  const b=BRANCHES.find(b=>
    b.id===branchName||
    b.name.toLowerCase()===branchName.toLowerCase()||
    branchName.toLowerCase().includes(b.name.toLowerCase())||
    b.name.toLowerCase().includes(branchName.toLowerCase())
  );
  if(!b)return;
  const h=await getVisitHistory();
  if(!h[b.id]||h[b.id]<dateStr){
    h[b.id]=dateStr;
    kvSet('p11g_visits',h);
  }
}

    if(typeof v==='object')return v;
  }
  try{const ls=localStorage.getItem('p11g_calls');return ls?JSON.parse(ls):{};}catch(ex){return {};}
}
async function recordCall(branchId,dateStr){
  if(!branchId||!dateStr)return;
  const h=await getCallHistory();
  if(!h[branchId]||h[branchId]<dateStr){
    h[branchId]=dateStr;
    kvSet('p11g_calls',h);
  }
}

// ── MIGRATION ── Push all localStorage p11 keys to cloud
async function migrateToCloud(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('p11'))keys.push(k);
  }
  let count=0;
  const errors=[];
  for(const k of keys){
    try{
      const raw=localStorage.getItem(k);
      if(!raw)continue;
      // Parse first to ensure it's valid, then send as clean JSON string
      let parsed;
      try{parsed=JSON.parse(raw);}catch(ex){continue;}
      const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,value:JSON.stringify(parsed)})});
      const d=await r.json();
      if(d.ok)count++;
      else errors.push(k+':'+JSON.stringify(d));
    }catch(ex){errors.push(k+':'+ex.message);}
  }
  if(errors.length)console.error('Migration errors:',errors);
  return{count,errors};
}

// ── STABLE INPUTS ──
const StableInput=memo(({value,onBlur,className,placeholder,type,style})=>{
  const[local,setLocal]=useState(value);
  useEffect(()=>{setLocal(value);},[value]);
  return e('input',{className,placeholder,type,style,value:local,
    onChange:ev=>setLocal(ev.target.value),
    onBlur:()=>onBlur(local)});
});
const StableTextarea=memo(({value,onBlur,className,placeholder,rows,style})=>{
  const[local,setLocal]=useState(value);
  useEffect(()=>{setLocal(value);},[value]);
  return e('textarea',{className,placeholder,rows,style,value:local,
    onChange:ev=>setLocal(ev.target.value),
    onBlur:()=>onBlur(local)});
});

function get21DayAlerts(scBranches){

  const missing=BRANCHES.filter(b=>!scBranches[b.id]?.call21).map(b=>b.name);

async function getBranchVisitDiary(branchName){
  // Scan daily keys from localStorage (cloud keys not enumerable, use local cache)
  const diary=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key||!key.startsWith('p11d_'))continue;
      const dateStr=key.replace('p11d_','');
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      const d=JSON.parse(raw);
      if(!d.branch)continue;
      // Match by name or partial
      const bn=d.branch.toLowerCase();
      const target=branchName.toLowerCase();
      if(bn===target||bn.includes(target)||target.includes(bn)){
        diary.push({
          date:dateStr,
          branch:d.branch,
          priorities:d.priorities||[],
          calls:(d.calls||[]).filter(c=>c.text),
          tasks:(d.tasks||[]).filter(t=>t.text),
          eod:d.eod||{},
          dor:d.dor,
          alerts:d.alerts,
        });
      }
    }
  }catch(ex){}
  return diary.sort((a,b)=>b.date.localeCompare(a.date));
}

async function load2130(branchId, weekKey){
  const key=`p11_2130_${branchId}_${weekKey}`;
  const r=await kvGet(key);
  if(r){
    let v=r;
    if(typeof v==='string'){try{v=JSON.parse(v);}catch(ex){}}
    if(v&&typeof v==='object')return v;
  }
  try{
    const ls=localStorage.getItem(key);
    if(ls)return JSON.parse(ls);
  }catch(ex){}
  return null;
}
function save2130(branchId, weekKey, data){
  const key=`p11_2130_${branchId}_${weekKey}`;
  kvSet(key, data);
}
function getPrevWeekKey(weekKey){
  const d=new Date(weekKey+'T12:00:00');
  d.setDate(d.getDate()-7);
  return d.toISOString().slice(0,10);
}
async function makeDefault2130(branchId, weekKey, branch){
  // Carry forward open/slipped items from last week
  const prevKey=getPrevWeekKey(weekKey);
  const prev=await load2130(branchId, prevKey);
  const carriedFollowups=prev
    ? prev.nextFollowups.filter(f=>f.text).map(f=>({text:f.text, status:'open'}))
    : [];
  const carriedRepos=prev
    ? (prev.repos||[]).filter(r=>r.text&&!r.resolved).map(r=>({...r}))
    : [];
  return {
    branchId, weekKey,
    date: todayStr(),
    totalAccounts:'', reviewedAccounts:'',
    priorFollowups: carriedFollowups,
    repos: carriedRepos.length>0 ? carriedRepos : [{text:'',resolved:false}],
    observations: Object.fromEntries(OBS_ITEMS.map(k=>[k,{rating:'na',notes:''}])),
    nextFollowups: [{text:''}],
    notes:'',
  };
}

  async function handleUpload(ev){
    const file=ev.target.files[0];
    if(!file)return;
    setUploading(true);

    try{

        r.onload=()=>res(r.result.split(',')[1]);
        r.onerror=()=>rej(new Error('Read failed'));
        r.readAsDataURL(file);
      });

      const response=await fetch('/api/claude',{
        method:'POST',

        body:JSON.stringify({
          model:'claude-sonnet-4-5',
          max_tokens:1000,
          system:'You are a data extraction assistant. Extract branch metrics from the scorecard PDF and return ONLY a JSON object with no markdown or explanation.',
          messages:[{
            role:'user',
            content:[
              {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
              {type:'text',text:`Extract metrics for these 11 branches: WI0262, WI0264, WI0270, WI0279, WI0290, WI0292, WI0305, WI0307, WI0316, WI0347, WI0348.

Return ONLY this JSON structure, no other text:
{
  "branches": {
    "WI0262": {"opb":"105.65%","cash":"28%","loss":"1.34%","hlOrg":"28.00%","hl3rd":"2.01%","rank":"5"},
    ...all 11 branches in same format...
  },
  "area": {"opb":"107.38%","cash":"23%","loss":"1.42%","hlOrg":"18.43%","hl3rd":"1.84%"}
}

For each branch find:
- opb: OPB % to Goal (page 1)
- cash: Cash Collected Actual % (page 1, bold column)
- loss: Losses Actual % (page 2, bold column)
- hlOrg: 90 Day Organic Hot Lead Conv % (page 3)
- hl3rd: 90 Day 3rd Party Hot Lead Conv % (page 3)
- rank: Overall Rank (left column, page 1)
For area row find same metrics from the Area/Eastern WI row.`}
            ]
          }]
        })
      });

      const data=await response.json();
      const statusMsg=`Status:${response.status}`;
      const dataPreview=JSON.stringify(data).slice(0,200);
      const text=data.content?.filter(c=>c.type==='text').map(c=>c.text).join('');

        return;
      }
      const clean=text.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);

      // Apply to scorecard
      const newSc={...sc};
      if(parsed.branches){

        });
      }
      if(parsed.area) newSc.area={...newSc.area,...parsed.area};
      onChange(newSc);
      setUploadMsg('Scorecard updated');
      setTimeout(()=>setUploadMsg(''),3000);
    }catch(err){
      const msg=err?.message||String(err);
      setUploadMsg('ERR: '+msg.slice(0,120));

// ── CANVAS NOTEPAD ──
function CanvasNotepad({value, onSave}){
  const[blocks,setBlocks]=useState(()=>{try{return value?JSON.parse(value):[];}catch(e){return[];}});
  const[fullscreen,setFullscreen]=useState(false);
  const[activeId,setActiveId]=useState(null);
  const containerRef=useRef(null);
  const fsContainerRef=useRef(null);

  useEffect(()=>{try{const p=value?JSON.parse(value):[];setBlocks(p);}catch(e){};},[value]);

  function save(nb){setBlocks(nb);onSave(JSON.stringify(nb));}

  function handleTap(ev,isFs){
    const ref=isFs?fsContainerRef:containerRef;
    if(!ref.current||ev.target.closest('.canvas-block'))return;
    const rect=ref.current.getBoundingClientRect();
    const x=ev.clientX-rect.left+(ref.current.scrollLeft||0);
    const y=ev.clientY-rect.top+(ref.current.scrollTop||0);
    const id=Date.now();
    save([...blocks,{id,x:Math.max(0,x-4),y:Math.max(0,y-10),text:''}]);
    setActiveId(id);
  }

  function updateText(id,text){save(blocks.map(b=>b.id===id?{...b,text}:b));}
  function deleteBlock(id){save(blocks.filter(b=>b.id!==id));setActiveId(null);}

  function autoSize(el){
    if(!el)return;
    el.style.height='auto';
    el.style.height=el.scrollHeight+'px';
    const len=el.value.split('\n').reduce((m,l)=>Math.max(m,l.length),0);
    el.style.width=Math.min(260,Math.max(80,len*8+20))+'px';
  }

  function renderBlocks(){
    return blocks.map(b=>e('div',{
      className:'canvas-block',key:b.id,
      style:{left:b.x+'px',top:b.y+'px'},
      onClick:ev=>ev.stopPropagation()
    },
      activeId===b.id&&e('button',{
        className:'canvas-block-del',
        onMouseDown:ev=>{ev.preventDefault();deleteBlock(b.id);}
      },P11UiIcon('close','block-close-ico')),
      e('textarea',{
        value:b.text,
        autoFocus:activeId===b.id&&!b.text,
        rows:1,
        onChange:ev=>{updateText(b.id,ev.target.value);autoSize(ev.target);},
        onFocus:()=>setActiveId(b.id),
        onBlur:()=>setActiveId(null),
        style:{
          background:'transparent',border:'none',outline:'none',
          fontFamily:"'Barlow',sans-serif",fontSize:'13px',color:'var(--text)',
          resize:'none',padding:'2px 4px',overflow:'hidden',lineHeight:'1.5',
          width:Math.min(260,Math.max(80,(b.text.split('\n').reduce((m,l)=>Math.max(m,l.length),0)||4)*8+20))+'px',
          minHeight:'20px'
        }
      })
    ));
  }

  const minH=blocks.length?Math.max(84,Math.max(...blocks.map(b=>b.y+60))+40):84;
  const fsMinH=blocks.length?Math.max(600,Math.max(...blocks.map(b=>b.y+80))+60):600;

  return e('div',null,
    e('div',{style:{position:'relative'}},
      e('div',{style:{position:'absolute',top:'4px',right:'6px',zIndex:10,display:'flex',gap:'4px'}},
        blocks.length>0&&e('button',{
          style:{background:'rgba(27,58,107,0.08)',border:'none',borderRadius:'4px',padding:'2px 6px',fontSize:'10px',cursor:'pointer',color:'var(--navy)',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700},
          onClick:()=>{save([]);setActiveId(null);}
        },'Clear'),
        e('button',{
          style:{background:'rgba(27,58,107,0.08)',border:'none',borderRadius:'4px',padding:'2px 6px',fontSize:'13px',cursor:'pointer',color:'var(--navy)'},
          onClick:()=>setFullscreen(true)
        },P11UiIcon('fullscreen','fullscreen-vector-ico'))
      ),
      e('div',{className:'canvas-notepad',ref:containerRef,onClick:ev=>handleTap(ev,false)},
        e('div',{className:'canvas-notepad-inner',style:{minHeight:minH+'px'}},renderBlocks())
      )
    ),
    fullscreen&&e('div',{style:{position:'fixed',inset:0,background:'rgba(27,58,107,0.4)',zIndex:999},onClick:()=>setFullscreen(false)}),
    fullscreen&&e('div',{className:'canvas-notepad-fs'},
      e('div',{className:'canvas-fs-header'},
        e('div',{className:'canvas-fs-title'},'Notes'),
        e('button',{className:'canvas-fs-close',onClick:()=>setFullscreen(false)},'Done')
      ),
      e('div',{className:'canvas-fs-body',ref:fsContainerRef,onClick:ev=>handleTap(ev,true)},
        e('div',{className:'canvas-fs-inner',style:{minHeight:fsMinH+'px'}},renderBlocks())
      )
    )
  );
}


// ── DAILY TAB ──
function DailyTab({currentDate,onDateChange,wkDays}){
  const[crashMsg,setCrashMsg]=useState('');
  const[dl,setDl]=useState(null);
  const[showCF,setShowCF]=useState(false);
  const[pendingDate,setPendingDate]=useState(null);
  const dlRef=useRef(dl);
  useEffect(()=>{dlRef.current=dl;},[dl]);

  // Load day data async on mount and date change
  useEffect(()=>{
    setDl(null);
    loadDay(currentDate).then(d=>setDl(d)).catch(err=>setCrashMsg(err.message));
  },[currentDate]);

  // Save when user switches apps or tabs on mobile
  useEffect(()=>{
    const handler=()=>{if(document.hidden&&dlRef.current)saveDay(currentDate,dlRef.current);};
    document.addEventListener('visibilitychange',handler);
    return()=>document.removeEventListener('visibilitychange',handler);
  },[currentDate]);

  const dow=getDow(currentDate);
  const dayName=DOW_MAP[dow];
  const safeWkDays=wkDays||{};
  const wkPlan=dayName?safeWkDays[dayName]:null;
  const hasWkPlan=wkPlan&&(wkPlan.branch||wkPlan.priorities.some(p=>p));
  const wkPlanAlreadyApplied=wkPlan&&dl&&dl.branch===wkPlan.branch;

  if(crashMsg)return e('div',{style:{padding:'20px',color:'red',fontFamily:'monospace',fontSize:'12px',wordBreak:'break-all'}},'DAILY ERROR: '+crashMsg);
  if(!dl)return e('div',{style:{padding:'40px',textAlign:'center',fontFamily:"'Barlow',sans-serif",color:'var(--gray)'}},'Loading...');

  // Validate dl structure
  try{
    if(!dl.priorities)throw new Error('dl.priorities missing');
    if(!dl.calls)throw new Error('dl.calls missing');
    if(!dl.tasks)throw new Error('dl.tasks missing');
    if(!dl.agenda)throw new Error('dl.agenda missing');
    if(!dl.eod)throw new Error('dl.eod missing');
  }catch(err){
    return e('div',{style:{padding:'20px',color:'red',fontFamily:'monospace',fontSize:'12px',wordBreak:'break-all'}},'STRUCTURE ERROR: '+err.message+' | dl='+JSON.stringify(dl).slice(0,200));
  }

  function persist(newDl){
    setDl(newDl);
    if(newDl.branch&&newDl.date)recordVisit(newDl.branch,newDl.date);
    saveDay(currentDate,newDl); // save immediately, no delay
  }

  function hasUnfinished(d){
    return d.priorities.some(p=>p)||d.calls.some(c=>c.text&&!c.done)||d.tasks.some(t=>t.text&&!t.done);
  }

  function navigateToDate(newDate){
    if(newDate===currentDate)return;
    if(hasUnfinished(dl)){
      setPendingDate(newDate);
      setShowCF(true);
    }else{
      onDateChange(newDate);
    }
  }

  function applyCarryForward(sel,items){
    const targetDate=pendingDate||currentDate;
    const base=makeDefaultDay(targetDate);
    let pi=0,ci=0,ti=0;
    sel.forEach(id=>{
      const item=items.find(it=>it.id===id);
      if(!item)return;
      if(item.tag==='pri'&&pi<3){base.priorities[pi]=item.label;pi++;}
      if(item.tag==='call'&&ci<8){base.calls[ci]={done:false,text:item.label};ci++;}
      if(item.tag==='task'&&ti<10){base.tasks[ti]={done:false,text:item.label};ti++;}
    });
    // Pull weekly plan for target date
    const targetDow=getDow(targetDate);
    const targetDay=DOW_MAP[targetDow];
    const plan=targetDay?safeWkDays[targetDay]:null;
    if(plan){
      if(plan.branch&&!base.branch)base.branch=plan.branch;
      plan.priorities.forEach((p,i)=>{if(p&&!base.priorities[i])base.priorities[i]=p;});
    }
    saveDay(targetDate,base);
    setShowCF(false);
    setPendingDate(null);
    if(pendingDate)onDateChange(pendingDate);
    else setDl(base);
  }

  function applyWeeklyPlan(){
    const nd={...dl};
    if(wkPlan.branch&&!dl.branch)nd.branch=wkPlan.branch;
    wkPlan.priorities.forEach((p,i)=>{if(p&&!dl.priorities[i])nd.priorities[i]=p;});
    persist(nd);
  }

  const upd=(k,v)=>persist({...dl,[k]:v});
  const updPri=(i,v)=>{const a=[...dl.priorities];a[i]=v;persist({...dl,priorities:a});};
  const updCall=(i,k,v)=>{const a=dl.calls.map((c,ci)=>ci===i?{...c,[k]:v}:c);persist({...dl,calls:a});};
  const updTask=(i,k,v)=>{const a=dl.tasks.map((t,ti)=>ti===i?{...t,[k]:v}:t);persist({...dl,tasks:a});};
  const addCall=()=>persist({...dl,calls:[...dl.calls,{done:false,text:''}]});
  const addTask=()=>persist({...dl,tasks:[...dl.tasks,{done:false,text:''}]});
  const updAgenda=(i,v)=>{const a=[...dl.agenda];a[i]=v;persist({...dl,agenda:a});};
  const updEod=(k,v)=>persist({...dl,eod:{...dl.eod,[k]:v}});

  const prevDate=addDays(currentDate,-1);
  const nextDate=addDays(currentDate,1);

  return e('div',null,
    // Date navigation
    e('div',{className:'daily-date-nav'},
      e('button',{className:'date-nav-btn icon-only-btn',onClick:()=>navigateToDate(prevDate),title:'Previous day'},P11UiIcon('prev','date-nav-ico')),
      e('div',{className:'date-display'},new Date(currentDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})),
      e('button',{className:'date-nav-btn icon-only-btn',onClick:()=>navigateToDate(nextDate),title:'Next day'},P11UiIcon('next','date-nav-ico'))
    ),
    // Weekly plan suggestion
    hasWkPlan&&!wkPlanAlreadyApplied&&e('div',{className:'from-weekly'},
      e('div',{className:'from-weekly-text icon-text-line'},P11UiIcon('weeklyplan','weekly-plan-ico'),e('span',null,'Weekly plan: '+wkPlan.branch+(wkPlan.type?' ('+wkPlan.type+')':''))),
      e('button',{onClick:applyWeeklyPlan},'Pre-fill')
    ),
    // Morning tasks card
    e('div',{className:'card'},
      e('div',{className:'card-header'},e('span',{className:'section-ico ico-morning'},e(P11Icon,{type:'morning'})),'Daily Morning Tasks'),
      e('div',{className:'card-body'},
        e('div',{style:{display:'flex',gap:'16px',alignItems:'center',marginBottom:'10px'}},
          e('div',{style:{flex:1}},
            e('label',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'10px',color:'var(--gray)',letterSpacing:'1px',textTransform:'uppercase',display:'block',marginBottom:'2px'}},'Date'),
            e('input',{type:'date',className:'date-inp',value:currentDate,readOnly:true,style:{cursor:'default'}})
          ),
          e('div',{className:'chk-row'},
            e('label',{className:'chk-lbl'},e('input',{type:'checkbox',checked:dl.dor,onChange:ev=>upd('dor',ev.target.checked)}),'DOR'),
            e('label',{className:'chk-lbl'},e('input',{type:'checkbox',checked:dl.alerts,onChange:ev=>upd('alerts',ev.target.checked)}),'Alerts')
          )
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          e('label',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'10px',color:'var(--gray)',letterSpacing:'1px',textTransform:'uppercase',flexShrink:0}},'Branch:'),
          e(StableInput,{className:'plain-input',value:dl.branch||'',onBlur:v=>upd('branch',v),placeholder:'Branch or office...'})
        )
      )
    ),
    // Priorities
    e('div',{className:'card'},
      e('div',{className:'card-header'},e('span',{className:'section-ico ico-priority'},e(P11Icon,{type:'priority'})),"Today's Priorities"),
      e('div',{className:'card-body'},
        dl.priorities.map((p,i)=>e('div',{className:'pri-row',key:i},
          e('div',{className:'pri-dot'},i+1),
          e(StableInput,{className:'plain-input',value:p,onBlur:v=>updPri(i,v),placeholder:`Priority ${i+1}...`})
        ))
      )
    ),
    // Calls
    e('div',{className:'card'},

// ── TODAY TAB ──
function TodayTab({currentDate,dl,onDlChange,sc,wkDays,wkMonTasks,weekKey,onSwitchTab}){
  const today=todayStr();
  const dow=getDow(currentDate);
  const dayName=DOW_MAP[dow];
  const wkPlan=dayName?wkDays[dayName]:null;
  const[visits,setVisits]=useState({});
  const[callHistory,setCallHistory]=useState({});
  useEffect(()=>{getVisitHistory().then(v=>setVisits(v||{}));},[]);
  useEffect(()=>{getCallHistory().then(v=>setCallHistory(v||{}));},[]);
  const[monthState2,setMonthState2]=useState({});
  const[monthState2Loaded,setMonthState2Loaded]=useState(false);
  useEffect(()=>{
    if(!monthState2Loaded){
      getMonthlyTaskState().then(s=>{setMonthState2(s||{});setMonthState2Loaded(true);});
    }
  },[monthState2Loaded]);
  const monthStr2=weekKey.slice(0,7);
  const monthlyTasks=getMonthlyTasks(weekKey);
  const eomDue2=EOM_CARRY_TASKS.filter(t=>!(monthState2[t.key]&&monthState2[t.key].month===monthStr2&&monthState2[t.key].done));

  // 21-day call status for each branch
  const callStatus=BRANCHES.map(b=>{
    const lastCall=callHistory[b.id]?daysBetween(callHistory[b.id],today):null;
    const checked=sc.branches[b.id]?.call21;
    return{...b,lastCall,checked};
  }).filter(b=>!b.checked).sort((a,b)=>a.id.localeCompare(b.id));

  function dorToggle(){
    const nd={...dl,dor:!dl.dor};
    onDlChange(nd);
  }

  const dorDone=dl.dor;
  const dateLabel=new Date(currentDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  return e('div',null,
    // Date
    e('div',{style:{padding:'4px 2px 10px'}},
      e('div',{className:'today-date'},dateLabel.split(',')[0]+','),
      e('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600,fontSize:'18px',color:'var(--navy)'}},
        dateLabel.split(',').slice(1).join(',').trim()
      )
    ),

    // DOR
    e('div',{className:`dor-block ${dorDone?'dor-done':''}`,onClick:dorToggle,style:{cursor:'pointer'}},
      e('div',null,
        e('div',{className:'dor-label'},'Daily Operations Review'),
        e('div',{className:'dor-sub'},dorDone?e('span',{className:'icon-text-line'},P11UiIcon('good','dor-status-ico'),e('span',null,"Completed — you're set for the day")):'Tap to confirm you\'ve reviewed the DOR')
      ),
      e('input',{type:'checkbox',className:'dor-check',checked:dorDone,onChange:dorToggle,onClick:ev=>ev.stopPropagation()})
    ),

    // Today's plan
    (wkPlan&&(wkPlan.branch||wkPlan.priorities.some(p=>p)))&&e('div',null,
      e('div',{className:'section-title'},"Today's Plan"),
      e('div',{className:'card'},
        wkPlan.branch&&e('div',{className:'today-plan-row'},
          e('div',{className:'today-plan-lbl'},'Branch'),
          e('div',{className:'today-plan-val'},wkPlan.type?`${wkPlan.branch} (${wkPlan.type})`:wkPlan.branch)
        ),
        ...wkPlan.priorities.filter(p=>p).map((p,i)=>e('div',{className:'today-plan-row',key:i},
          e('div',{className:'today-plan-lbl'},`Priority ${i+1}`),
          e('div',{className:'today-plan-val'},p)
        )),
        e('div',{style:{padding:'10px 12px',textAlign:'right'}},
          e('button',{className:'go-btn icon-text-btn',onClick:()=>onSwitchTab('daily')},e('span',null,'Open Daily'),P11UiIcon('carry','go-arrow-ico'))
        )
      )
    ),

    // Monthly tasks this week
    (monthlyTasks.length>0||eomDue2.length>0)&&e('div',null,
      e('div',{className:'section-title'},'This Week'),
      e('div',{className:'card'},
        e('div',null,
          eomDue2.map((t,i)=>e('div',{className:'monthly-row',key:'eom'+i,style:{background:'#FFF8E7',borderLeft:'3px solid var(--gold)'}},
            e('span',null,t.label)
          )),
          monthlyTasks.filter((_,i)=>!(wkMonTasks[BASE_MON_TASKS.length+i]||false)).map((t,i)=>e('div',{className:'monthly-row',key:i},
            e('span',null,t.label)
          ))
        )
      )
    ),

    // 21-day calls
    e('div',{className:'section-title'},'21-Day Calls'),
    e('div',{className:'card'},
      callStatus.map(b=>{
          const days=b.lastCall;
          let cls='call-due', label='Due';
          if(days===null){cls='call-overdue';label='Never';}
          else if(days>21){cls='call-overdue';label=`${days}d ago`;}
          else if(days>14){cls='call-due';label=`${days}d ago`;}
          else{cls='call-ok';label=`${days}d ago`;}
          return e('div',{className:'call-row',key:b.id},
            e('div',{className:'call-branch'},b.id+' · '+b.name),
            e('span',{className:`call-days ${cls}`},label)
          );
        })
    )
  );
}

function P11TaskIcon({label}) {
  const map={
    'Run & Send Monthly Goals':'rungoals',
    'Review & Approve Payroll':'approvepayroll',
    'Submit Mileage Reimbursement':'mileage',
    'Submit Expense Report':'expense',
    'Submit Supply Orders':'supply',
    'Monthly Goals':'goals',
    'EOM Scorecard':'eom',
    'Send EOM Scorecard':'eom',
    'Loss Projections':'loss',
    'Payroll':'payroll',
    'Monthly Schedule':'schedule'
  };
  const type=map[label];
  return type?e('span',{className:'task-mini-ico'},e(P11Icon,{type})):null;
}

// ── APP ──
function App(){
  const today=todayStr();
  const[weekKey,setWeekKey]=useState(()=>getWeekKey(today));
  const[weekData,setWeekData]=useState(null);
  const[currentDate,setCurrentDate]=useState(today);
  const[tab,setTab]=useState('today');
  const[showModal,setShowModal]=useState(false);
  const[saved,setSaved]=useState(false);
  const[modalDate,setModalDate]=useState(today);
  const[dailyData,setDailyData]=useState(null);
  const[migrating,setMigrating]=useState(false);
  const[migrateMsg,setMigrateMsg]=useState('');
  const saveTimer=useRef(null);

  // Load week data async on mount and when weekKey changes
  useEffect(()=>{
    setWeekData(null);
    loadWeek(weekKey).then(d=>setWeekData(d));
  },[weekKey]);

  // Load daily data async when currentDate changes
  useEffect(()=>{
    setDailyData(null);
    loadDay(currentDate).then(d=>setDailyData(d));
  },[currentDate]);

  const{alerts}=weekData?get21DayAlerts(weekData.sc.branches):{alerts:[]};

  // When date changes, update week context if needed
  function handleDateChange(newDate){
    setCurrentDate(newDate);
    const newWeek=getWeekKey(newDate);
    if(newWeek!==weekKey){
      setWeekKey(newWeek);
    }
    window.scrollTo(0,0);
  }

  function handleWeekChange(section,val){
    const nd={...weekData,[section]:val};
    setWeekData(nd);
    saveWeek(weekKey,nd);
    setSaved(true);
    setTimeout(()=>setSaved(false),1500);
  }

  function switchWeek(){
    const key=getWeekKey(modalDate);
    setWeekKey(key);
    setCurrentDate(key);
    setShowModal(false);
    window.scrollTo(0,0);
  }

  async function handleMigrate(){
    setMigrating(true);
    setMigrateMsg('Migrating...');
    const{count,errors}=await migrateToCloud();
    setMigrateMsg(errors.length?`✓ ${count} migrated, ${errors.length} errors — check console`:`✓ Migrated ${count} records to cloud`);
    setMigrating(false);
    // Reload current week from cloud
    loadWeek(weekKey).then(d=>setWeekData(d));
    loadDay(currentDate).then(d=>setDailyData(d));
  }

  const switchTab=t=>{setTab(t);window.scrollTo(0,0);};

  return e('div',null,
    e('div',{className:'app-header'},
      e('div',{className:'header-top'},
        e('div',{className:'brand-wrap'},

<!-- PROJECT 11 — unified cross-tab design system -->
<style id="p11-unified-tabs">
/* Keep the blueprint motif in one fixed global location so every tab reads the same. */
.app-header::after{content:'';position:absolute;right:0;bottom:0;width:118px;height:38px;pointer-events:none;background-image:radial-gradient(circle,#6DA5F4 1.1px,transparent 1.1px);background-size:8px 8px;opacity:.22;mask-image:linear-gradient(90deg,transparent 0,#000 48%,#000 100%);z-index:-1;}
.tabs{position:relative;}
.tab{z-index:1;}
/* Remove content-dependent decorative dots from card headers on every page. */
.card-header::after{display:none!important;}
/* One consistent section language across Scorecard, Weekly, Today and Daily. */
.section-title{padding-left:8px;border-left:3px solid var(--blue);line-height:1.15;}
.card-header{min-height:44px;}
/* Daily's icon tiles remain functional section identifiers, but no page gets floating decoration. */
.card-header .section-ico{position:relative;z-index:1;}
</style>
