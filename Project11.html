<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const{useState,useEffect,useCallback,useRef,memo,useMemo}=React;
const e=React.createElement;

// ── CONSTANTS ──
const BRANCHES=[
  {id:'WI0262',name:'Green Bay'},{id:'WI0264',name:'Sheboygan'},
  {id:'WI0270',name:'Oshkosh'},{id:'WI0279',name:'2nd & Layton'},
  {id:'WI0290',name:'Miller Pkwy'},{id:'WI0292',name:'Appleton'},
  {id:'WI0305',name:'Racine'},{id:'WI0307',name:'Fond du Lac'},
  {id:'WI0316',name:'West Allis'},{id:'WI0347',name:'76th & Good Hope'},
  {id:'WI0348',name:'Kenosha'},
];
const DAYS=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
const TIMES=['9:00 AM','9:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM',
  '12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','2:30 PM',
  '3:00 PM','3:30 PM','4:00 PM','4:30 PM','5:00 PM','5:30 PM','6:00 PM'];
// ── MONTHLY RECURRING TASKS ──
// Payroll anchor: Monday April 27, 2026 — every other Monday from there
const PAYROLL_ANCHOR = '2026-04-27';
function isPayrollWeek(weekKey){
  const anchor=new Date(PAYROLL_ANCHOR+'T12:00:00');
  const week=new Date(weekKey+'T12:00:00');
  const diffWeeks=Math.round((week-anchor)/(7*24*60*60*1000));
  return diffWeeks%2===0;
}
function getWeekOfMonth(weekKey){
  const d=new Date(weekKey+'T12:00:00');
  const month=d.getMonth(), year=d.getFullYear();
  let count=0;
  for(let day=1;day<=d.getDate();day++){if(new Date(year,month,day).getDay()===1)count++;}
  const daysInMonth=new Date(year,month+1,0).getDate();
  // Last FULL week = last Monday where Saturday (Mon+5) is still in the same month
  let lastFullMonday=0;
  for(let day=daysInMonth;day>=1;day--){
    if(new Date(year,month,day).getDay()===1){
      if(day+5<=daysInMonth){lastFullMonday=day;break;}
    }
  }
  return{count,isLastFull:d.getDate()===lastFullMonday};
}
function getMonthlyTasks(weekKey){
  const{count,isLastFull}=getWeekOfMonth(weekKey);
  const tasks=[];
  if(count===1)tasks.push('📋 Submit Mileage Reimbursement');
  if(count===2)tasks.push('📦 Submit Supply Orders');
  if(isPayrollWeek(weekKey))tasks.push('💰 Review & Approve Payroll');
  if(isLastFull)tasks.push('📅 Send Monthly Schedule Email');
  return tasks;
}
const BASE_MON_TASKS=['Written-Off Accounts','Recovery Accounts','Weekly Scorecard','Week Planning'];
const METRIC_KEYS=['opb','cash','loss','hlOrg','hl3rd'];
const METRIC_LABELS=['OPB %','Cash %','Loss %','HL Org','HL 3rd'];
const DOW_MAP={1:'MONDAY',2:'TUESDAY',3:'WEDNESDAY',4:'THURSDAY',5:'FRIDAY'};

// ── UTILS ──
function todayStr(){const d=new Date();const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function getWeekKey(date){
  const d=new Date(typeof date==='string'?date+'T12:00:00':date);
  const diff=d.getDate()-d.getDay()+(d.getDay()===0?-6:1);
  return new Date(d.setDate(diff)).toISOString().slice(0,10);
}
function fmtWeek(k){return new Date(k+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDate(s){if(!s)return null;return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDateLong(s){if(!s)return '';return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});}
function daysBetween(a,b){return Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/(1000*60*60*24));}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function getDow(dateStr){return new Date(dateStr+'T12:00:00').getDay();}

// ── STORAGE ──
// Cloud storage via /api/data — falls back to localStorage if offline

async function kvGet(key){
  try{
    const r=await fetch('/api/data?key='+encodeURIComponent(key));
    const d=await r.json();
    if(d.value===null||d.value===undefined)return null;
    // Unwrap any depth of JSON encoding
    let v=d.value;
    let attempts=0;
    while(typeof v==='string'&&attempts<10){
      try{const p=JSON.parse(v);v=p;attempts++;}catch(ex){break;}
    }
    return v;
  }catch(ex){}
  return null;
}
async function kvSet(key,value){
  // Always write localStorage first
  try{localStorage.setItem(key,JSON.stringify(value));}catch(ex){}
  // Then try cloud
  try{
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value:JSON.stringify(value)})});
  }catch(ex){}
}

// Week data
async function loadWeek(weekKey){
  let r=await kvGet('p11w_'+weekKey);
  if(r){
    if(typeof r==='string'){try{r=JSON.parse(r);}catch(ex){}}
  }
  if(r&&r.sc&&r.sc.area&&r.wk)return r;
  // Fall back to localStorage
  try{
    const ls=localStorage.getItem('p11w_'+weekKey);
    if(ls){const p=JSON.parse(ls);if(p&&p.sc&&p.sc.area&&p.wk)return p;}
  }catch(ex){}
  if(weekKey===SEED_WEEK_KEY)return JSON.parse(JSON.stringify(SEED_DATA));
  return makeDefaultWeek();
}
function saveWeek(weekKey,data){kvSet('p11w_'+weekKey,data);}

// ── MIGRATION ── Push all localStorage p11 keys to cloud
async function migrateToCloud(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('p11'))keys.push(k);
  }
  let count=0;
  const errors=[];
  for(const k of keys){
    try{
      const raw=localStorage.getItem(k);
      if(!raw)continue;
      // Parse first to ensure it's valid, then send as clean JSON string
      let parsed;
      try{parsed=JSON.parse(raw);}catch(ex){continue;}
      const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,value:JSON.stringify(parsed)})});
      const d=await r.json();
      if(d.ok)count++;
      else errors.push(k+':'+JSON.stringify(d));
    }catch(ex){errors.push(k+':'+ex.message);}
  }
  if(errors.length)console.error('Migration errors:',errors);
  return{count,errors};
}

async function getBranchVisitDiary(branchName){
  // Scan daily keys from localStorage (cloud keys not enumerable, use local cache)
  const diary=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key||!key.startsWith('p11d_'))continue;
      const dateStr=key.replace('p11d_','');
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      const d=JSON.parse(raw);
      if(!d.branch)continue;
      // Match by name or partial
      const bn=d.branch.toLowerCase();
      const target=branchName.toLowerCase();
      if(bn===target||bn.includes(target)||target.includes(bn)){
        diary.push({
          date:dateStr,
          branch:d.branch,
          priorities:d.priorities||[],
          calls:(d.calls||[]).filter(c=>c.text),
          tasks:(d.tasks||[]).filter(t=>t.text),
          eod:d.eod||{},
          dor:d.dor,
          alerts:d.alerts,
        });
      }
    }
  }catch(ex){}
  return diary.sort((a,b)=>b.date.localeCompare(a.date));
}

  const[uploadMsg,setUploadMsg]=useState('');

  const fileRef=useRef(null);

  const updArea=(k,v)=>onChange({...sc,area:{...sc.area,[k]:v}});
  const updPri=(i,v)=>{const a=[...sc.areaPri];a[i]=v;onChange({...sc,areaPri:a});};
  const updBranch=(id,k,v)=>onChange({...sc,branches:{...sc.branches,[id]:{...sc.branches[id],[k]:v}}});

  async function handleUpload(ev){
    const file=ev.target.files[0];
    if(!file)return;
    setUploading(true);
    setUploadMsg('Reading scorecard...');
    try{
      const base64=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result.split(',')[1]);
        r.onerror=()=>rej(new Error('Read failed'));
        r.readAsDataURL(file);
      });

      const response=await fetch('/api/claude',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1000,
          system:'You are a data extraction assistant. Extract branch metrics from the scorecard PDF and return ONLY a JSON object with no markdown or explanation.',
          messages:[{
            role:'user',
            content:[
              {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
              {type:'text',text:`Extract metrics for these 11 branches: WI0262, WI0264, WI0270, WI0279, WI0290, WI0292, WI0305, WI0307, WI0316, WI0347, WI0348.

Return ONLY this JSON structure, no other text:
{
  "branches": {
    "WI0262": {"opb":"105.65%","cash":"28%","loss":"1.34%","hlOrg":"28.00%","hl3rd":"2.01%","rank":"5"},
    ...all 11 branches in same format...
  },
  "area": {"opb":"107.38%","cash":"23%","loss":"1.42%","hlOrg":"18.43%","hl3rd":"1.84%"}
}

For each branch find:
- opb: OPB % to Goal (page 1)
- cash: Cash Collected Actual % (page 1, bold column)
- loss: Losses Actual % (page 2, bold column)
- hlOrg: 90 Day Organic Hot Lead Conv % (page 3)
- hl3rd: 90 Day 3rd Party Hot Lead Conv % (page 3)
- rank: Overall Rank (left column, page 1)
For area row find same metrics from the Area/Eastern WI row.`}
            ]
          }]
        })
      });

      const data=await response.json();
      const statusMsg=`Status:${response.status}`;
      const dataPreview=JSON.stringify(data).slice(0,200);
      const text=data.content?.filter(c=>c.type==='text').map(c=>c.text).join('');
      if(!text){
        setUploadMsg(`No text in response. ${statusMsg} ${dataPreview}`);
        setUploading(false);
        return;
      }
      const clean=text.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);

      // Apply to scorecard
      const newSc={...sc};
      if(parsed.branches){
        Object.entries(parsed.branches).forEach(([id,metrics])=>{
          if(newSc.branches[id]){
            newSc.branches[id]={...newSc.branches[id],...metrics};
          }
        });
      }
      if(parsed.area) newSc.area={...newSc.area,...parsed.area};
      onChange(newSc);
      setUploadMsg('✓ Scorecard updated');
      setTimeout(()=>setUploadMsg(''),3000);
    }catch(err){
      const msg=err?.message||String(err);
      setUploadMsg('ERR: '+msg.slice(0,120));
      setTimeout(()=>setUploadMsg(''),15000);
    }
    setUploading(false);
    if(fileRef.current)fileRef.current.value='';
  }

  function visitDisplay(bid){
    const d=visits[bid];
    if(!d)return e('span',{className:'visit-none'},'—');

    return e('span',{className:'visit-old'},lbl);

  return e('div',null,

    ),
    e('div',{className:'card'},
      e('div',{className:'card-header',style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
        e('span',null,'Area Weekly Results'),
        e('label',{style:{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:'5px',padding:'3px 8px',fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:'10px',color:'var(--white)',cursor:'pointer',letterSpacing:'1px',whiteSpace:'nowrap'}},
          uploading?'Reading...':'⬆ Upload PDF',
          e('input',{type:'file',accept:'.pdf',ref:fileRef,style:{display:'none'},onChange:handleUpload,disabled:uploading})
        )
      ),
      uploadMsg&&e('div',{style:{padding:'8px 12px',fontFamily:"'Barlow',sans-serif",fontSize:'11px',color:uploadMsg.startsWith('✓')?'var(--green)':'var(--red)',background:uploadMsg.startsWith('✓')?'#E8F5E9':'#FFEBEE',wordBreak:'break-word'}},uploadMsg),
      e('div',{className:'card-body'},
        e('div',{className:'area-metrics'},
          METRIC_KEYS.map((k,i)=>e('div',{className:'metric-box',key:k},
            e('div',{className:'metric-lbl'},METRIC_LABELS[i]),
            e(StableInput,{className:'metric-inp',value:sc.area[k],onBlur:v=>updArea(k,v),placeholder:'—'})
          ))

// ── DAILY TAB ──
function DailyTab({currentDate,onDateChange,wkDays}){
  const[crashMsg,setCrashMsg]=useState('');
  const[dl,setDl]=useState(null);
  const[showCF,setShowCF]=useState(false);
  const[pendingDate,setPendingDate]=useState(null);
  const dlRef=useRef(dl);
  useEffect(()=>{dlRef.current=dl;},[dl]);

  // Load day data async on mount and date change
  useEffect(()=>{
    setDl(null);
    loadDay(currentDate).then(d=>setDl(d)).catch(err=>setCrashMsg(err.message));
  },[currentDate]);

  // Save when user switches apps or tabs on mobile
  useEffect(()=>{
    const handler=()=>{if(document.hidden&&dlRef.current)saveDay(currentDate,dlRef.current);};
    document.addEventListener('visibilitychange',handler);
    return()=>document.removeEventListener('visibilitychange',handler);
  },[currentDate]);

  const dow=getDow(currentDate);
  const dayName=DOW_MAP[dow];
  const safeWkDays=wkDays||{};
  const wkPlan=dayName?safeWkDays[dayName]:null;
  const hasWkPlan=wkPlan&&(wkPlan.branch||wkPlan.priorities.some(p=>p));
  const wkPlanAlreadyApplied=wkPlan&&dl&&dl.branch===wkPlan.branch;

  if(crashMsg)return e('div',{style:{padding:'20px',color:'red',fontFamily:'monospace',fontSize:'12px',wordBreak:'break-all'}},'DAILY ERROR: '+crashMsg);
  if(!dl)return e('div',{style:{padding:'40px',textAlign:'center',fontFamily:"'Barlow',sans-serif",color:'var(--gray)'}},'Loading...');

  // Validate dl structure
  try{
    if(!dl.priorities)throw new Error('dl.priorities missing');
    if(!dl.calls)throw new Error('dl.calls missing');
    if(!dl.tasks)throw new Error('dl.tasks missing');
    if(!dl.agenda)throw new Error('dl.agenda missing');
    if(!dl.eod)throw new Error('dl.eod missing');
  }catch(err){
    return e('div',{style:{padding:'20px',color:'red',fontFamily:'monospace',fontSize:'12px',wordBreak:'break-all'}},'STRUCTURE ERROR: '+err.message+' | dl='+JSON.stringify(dl).slice(0,200));
  }

  function persist(newDl){
    setDl(newDl);
    if(newDl.branch&&newDl.date)recordVisit(newDl.branch,newDl.date);
    saveDay(currentDate,newDl); // save immediately, no delay
  }

  function hasUnfinished(d){
    return d.priorities.some(p=>p)||d.calls.some(c=>c.text&&!c.done)||d.tasks.some(t=>t.text&&!t.done);
  }

  function navigateToDate(newDate){
    if(newDate===currentDate)return;
    if(hasUnfinished(dl)){
      setPendingDate(newDate);
      setShowCF(true);
    }else{
      onDateChange(newDate);
    }
  }

  function applyCarryForward(sel,items){
    const targetDate=pendingDate||currentDate;
    const base=makeDefaultDay(targetDate);
    let pi=0,ci=0,ti=0;
    sel.forEach(id=>{
      const item=items.find(it=>it.id===id);
      if(!item)return;
      if(item.tag==='pri'&&pi<3){base.priorities[pi]=item.label;pi++;}
      if(item.tag==='call'&&ci<8){base.calls[ci]={done:false,text:item.label};ci++;}
      if(item.tag==='task'&&ti<10){base.tasks[ti]={done:false,text:item.label};ti++;}
    });
    // Pull weekly plan for target date
    const targetDow=getDow(targetDate);
    const targetDay=DOW_MAP[targetDow];
    const plan=targetDay?safeWkDays[targetDay]:null;
    if(plan){
      if(plan.branch&&!base.branch)base.branch=plan.branch;
      plan.priorities.forEach((p,i)=>{if(p&&!base.priorities[i])base.priorities[i]=p;});
    }
    saveDay(targetDate,base);
    setShowCF(false);
    setPendingDate(null);
    if(pendingDate)onDateChange(pendingDate);
    else setDl(base);
  }

  function applyWeeklyPlan(){
    const nd={...dl};
    if(wkPlan.branch&&!dl.branch)nd.branch=wkPlan.branch;
    wkPlan.priorities.forEach((p,i)=>{if(p&&!dl.priorities[i])nd.priorities[i]=p;});
    persist(nd);
  }

  const upd=(k,v)=>persist({...dl,[k]:v});
  const updPri=(i,v)=>{const a=[...dl.priorities];a[i]=v;persist({...dl,priorities:a});};
  const updCall=(i,k,v)=>{const a=dl.calls.map((c,ci)=>ci===i?{...c,[k]:v}:c);persist({...dl,calls:a});};
  const updTask=(i,k,v)=>{const a=dl.tasks.map((t,ti)=>ti===i?{...t,[k]:v}:t);persist({...dl,tasks:a});};
  const updAgenda=(i,v)=>{const a=[...dl.agenda];a[i]=v;persist({...dl,agenda:a});};
  const updEod=(k,v)=>persist({...dl,eod:{...dl.eod,[k]:v}});

  const prevDate=addDays(currentDate,-1);
  const nextDate=addDays(currentDate,1);

  return e('div',null,
    // Date navigation
    e('div',{className:'daily-date-nav'},
      e('button',{className:'date-nav-btn',onClick:()=>navigateToDate(prevDate)},'‹'),
      e('div',{className:'date-display'},fmtDateLong(currentDate)),
      e('button',{className:'date-nav-btn',onClick:()=>navigateToDate(nextDate)},'›')
    ),
    // Weekly plan suggestion
    hasWkPlan&&!wkPlanAlreadyApplied&&e('div',{className:'from-weekly'},
      e('div',{className:'from-weekly-text'},'📋 Weekly plan: '+wkPlan.branch+(wkPlan.type?' ('+wkPlan.type+')':'')),
      e('button',{onClick:applyWeeklyPlan},'Pre-fill')
    ),
    // Morning tasks card
    e('div',{className:'card'},
      e('div',{className:'card-header'},'Daily Morning Tasks'),
      e('div',{className:'card-body'},
        e('div',{style:{display:'flex',gap:'16px',alignItems:'center',marginBottom:'10px'}},
          e('div',{style:{flex:1}},
            e('label',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'10px',color:'var(--gray)',letterSpacing:'1px',textTransform:'uppercase',display:'block',marginBottom:'2px'}},'Date'),
            e('input',{type:'date',className:'date-inp',value:currentDate,readOnly:true,style:{cursor:'default'}})
          ),
          e('div',{className:'chk-row'},
            e('label',{className:'chk-lbl'},e('input',{type:'checkbox',checked:dl.dor,onChange:ev=>upd('dor',ev.target.checked)}),'DOR'),
            e('label',{className:'chk-lbl'},e('input',{type:'checkbox',checked:dl.alerts,onChange:ev=>upd('alerts',ev.target.checked)}),'Alerts')
          )
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
          e('label',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'10px',color:'var(--gray)',letterSpacing:'1px',textTransform:'uppercase',flexShrink:0}},'Branch:'),
          e(StableInput,{className:'plain-input',value:dl.branch||'',onBlur:v=>upd('branch',v),placeholder:'Branch or office...'})
        )
      )
    ),
    // Priorities
    e('div',{className:'card'},
      e('div',{className:'card-header'},"Today's Priorities"),
      e('div',{className:'card-body'},
        dl.priorities.map((p,i)=>e('div',{className:'pri-row',key:i},
          e('div',{className:'pri-dot'},i+1),
          e(StableInput,{className:'plain-input',value:p,onBlur:v=>updPri(i,v),placeholder:`Priority ${i+1}...`})
        ))
      )
    ),
    // Calls
    e('div',{className:'card'},
      e('div',{className:'card-header'},'Calls & Communications'),
      e('div',{className:'task-list'},
        dl.calls.map((c,i)=>e('div',{className:`task-row ${c.done?'done-row':''}`,key:i},
          e('input',{type:'checkbox',checked:c.done,onChange:ev=>updCall(i,'done',ev.target.checked)}),
          e(StableInput,{className:'plain-input',style:{fontSize:'12px'},value:c.text,onBlur:v=>updCall(i,'text',v),placeholder:'Call or note...'})
        ))
      )
    ),
    // Tasks
    e('div',{className:'card'},
      e('div',{className:'card-header'},'Other Tasks'),
      e('div',{className:'task-list'},
        dl.tasks.map((t,i)=>e('div',{className:`task-row ${t.done?'done-row':''}`,key:i},
          e('input',{type:'checkbox',checked:t.done,onChange:ev=>updTask(i,'done',ev.target.checked)}),
          e(StableInput,{className:'plain-input',style:{fontSize:'12px'},value:t.text,onBlur:v=>updTask(i,'text',v),placeholder:'Task...'})
        ))
      )
    ),
    // Agenda
    e('div',{className:'card'},
      e('div',{className:'card-header'},"Today's Agenda"),
      e('div',{className:'time-slots'},
        TIMES.map((t,i)=>e('div',{className:'time-row',key:i},
          e('div',{className:'time-lbl'},t),
          e(StableInput,{value:dl.agenda[i],onBlur:v=>updAgenda(i,v),placeholder:''})
        ))
      )
    ),
    // Notes
    e('div',{className:'card'},
      e('div',{className:'card-header'},'Notes'),
      e('div',{className:'dot-area'},
        e(StableTextarea,{value:dl.notes,onBlur:v=>upd('notes',v),placeholder:'Task notes, ideas, reminders...'})
      )
    ),
    // EOD
    e('div',{className:'card'},
      e('div',{className:'card-header'},'End-of-Day Review'),
      e('div',{className:'eod-checks'},
        e('span',{className:'eod-lbl'},'Priorities Done:'),
        [1,2,3].map(n=>e('label',{className:'pri-check',key:n},
          e('input',{type:'checkbox',checked:dl.eod[`p${n}`],onChange:ev=>updEod(`p${n}`,ev.target.checked)}),n
        ))
      ),
      e('div',{className:'eod-field'},
        e('label',null,'What went well?'),
        e(StableTextarea,{value:dl.eod.well,onBlur:v=>updEod('well',v),rows:2})
      ),
      e('div',{className:'eod-field'},
        e('label',null,'What can I improve?'),
        e(StableTextarea,{value:dl.eod.improve,onBlur:v=>updEod('improve',v),rows:2})
      ),
      e('div',{className:'eod-field',style:{borderBottom:'none'}},
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}},
          e('label',{style:{margin:0}},'Carry Forward →'),
          e('button',{className:'btn btn-s',style:{flex:'0',padding:'4px 10px',fontSize:'11px'},onClick:()=>setShowCF(true)},'Select Items')
        ),
        e(StableTextarea,{value:dl.eod.carry,onBlur:v=>updEod('carry',v),rows:1,placeholder:'Notes on what carries...'})
      )
    ),
    showCF&&e(CarryForwardModal,{dl,newDateStr:pendingDate,
      onApply:applyCarryForward,
      onClose:()=>{setShowCF(false);setPendingDate(null);}
    })
  );
}

// ── TODAY TAB ──
function TodayTab({currentDate,dl,onDlChange,sc,wkDays,weekKey,onSwitchTab}){
  const today=todayStr();
  const dow=getDow(currentDate);
  const dayName=DOW_MAP[dow];
  const wkPlan=dayName?wkDays[dayName]:null;
  const[visits,setVisits]=useState({});
  useEffect(()=>{getVisitHistory().then(v=>setVisits(v||{}));},[]);
  const monthlyTasks=getMonthlyTasks(weekKey);

  // 21-day call status for each branch
  const callStatus=BRANCHES.map(b=>{
    const lastCall=visits[b.id]?daysBetween(visits[b.id],today):null;
    const checked=sc.branches[b.id]?.call21;
    return{...b,lastCall,checked};
  }).filter(b=>!b.checked).sort((a,b)=>{
    if(a.lastCall===null)return -1;
    if(b.lastCall===null)return 1;
    return b.lastCall-a.lastCall;
  });

  function dorToggle(){
    const nd={...dl,dor:!dl.dor};
    onDlChange(nd);
  }

  const dorDone=dl.dor;
  const dateLabel=new Date(currentDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  return e('div',null,
    // Date
    e('div',{style:{padding:'4px 2px 10px'}},
      e('div',{className:'today-date'},dateLabel.split(',')[0]+','),
      e('div',{style:{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600,fontSize:'18px',color:'var(--navy)'}},
        dateLabel.split(',').slice(1).join(',').trim()
      )
    ),

    // DOR
    e('div',{className:`dor-block ${dorDone?'dor-done':''}`,onClick:dorToggle,style:{cursor:'pointer'}},
      e('div',null,
        e('div',{className:'dor-label'},'Daily Operations Review'),
        e('div',{className:'dor-sub'},dorDone?'✓ Completed — you\'re set for the day':'Tap to confirm you\'ve reviewed the DOR')
      ),
      e('input',{type:'checkbox',className:'dor-check',checked:dorDone,onChange:dorToggle,onClick:ev=>ev.stopPropagation()})
    ),

    // Monthly tasks this week
    monthlyTasks.length>0&&e('div',null,
      e('div',{className:'section-title'},'This Week'),
      e('div',{className:'card'},
        e('div',{style:{borderLeft:'3px solid var(--gold)'}},
          monthlyTasks.map((t,i)=>e('div',{className:'monthly-row',key:i},
            e('span',null,t)
          ))
        )
      )
    ),

    // 21-day calls
    e('div',{className:'section-title'},'21-Day Calls'),
    e('div',{className:'card'},
      callStatus.length===0
        ?e('div',{style:{padding:'12px',fontFamily:"'Barlow',sans-serif",fontSize:'13px',color:'var(--green)',textAlign:'center'}},'✓ All branches called this week')
        :callStatus.map(b=>{
          const days=b.lastCall;
          let cls='call-due', label='Due';
          if(days===null){cls='call-overdue';label='Never';}
          else if(days>21){cls='call-overdue';label=`${days}d ago`;}
          else if(days>14){cls='call-due';label=`${days}d ago`;}
          else{cls='call-ok';label=`${days}d ago`;}
          return e('div',{className:'call-row',key:b.id},
            e('div',{className:'call-branch'},b.name),
            e('span',{className:`call-days ${cls}`},label)
          );
        })
    ),

    // Today's plan
    (wkPlan&&(wkPlan.branch||wkPlan.priorities.some(p=>p)))&&e('div',null,
      e('div',{className:'section-title'},"Today's Plan"),
      e('div',{className:'card'},
        wkPlan.branch&&e('div',{className:'today-plan-row'},
          e('div',{className:'today-plan-lbl'},'Branch'),
          e('div',{className:'today-plan-val'},wkPlan.type?`${wkPlan.branch} (${wkPlan.type})`:wkPlan.branch)
        ),
        ...wkPlan.priorities.filter(p=>p).map((p,i)=>e('div',{className:'today-plan-row',key:i},
          e('div',{className:'today-plan-lbl'},`Priority ${i+1}`),
          e('div',{className:'today-plan-val'},p)
        )),
        e('div',{style:{padding:'10px 12px',textAlign:'right'}},
          e('button',{className:'go-btn',onClick:()=>onSwitchTab('daily')},'Open Daily →')
        )
      )
    )
  );
}

// ── APP ──
function App(){
  const today=todayStr();
  const[weekKey,setWeekKey]=useState(()=>getWeekKey(today));
  const[weekData,setWeekData]=useState(null);
  const[currentDate,setCurrentDate]=useState(today);
  const[tab,setTab]=useState('today');
  const[showModal,setShowModal]=useState(false);
  const[saved,setSaved]=useState(false);
  const[modalDate,setModalDate]=useState(today);
  const[dailyData,setDailyData]=useState(null);
  const[migrating,setMigrating]=useState(false);
  const[migrateMsg,setMigrateMsg]=useState('');
  const saveTimer=useRef(null);

  // Load week data async on mount and when weekKey changes
  useEffect(()=>{
    setWeekData(null);
    loadWeek(weekKey).then(d=>setWeekData(d));
  },[weekKey]);

  // Load daily data async when currentDate changes
  useEffect(()=>{
    setDailyData(null);
    loadDay(currentDate).then(d=>setDailyData(d));
  },[currentDate]);

  const{alerts}=weekData?get21DayAlerts(weekData.sc.branches):{alerts:[]};

  // When date changes, update week context if needed
  function handleDateChange(newDate){
    setCurrentDate(newDate);
    const newWeek=getWeekKey(newDate);
    if(newWeek!==weekKey){
      setWeekKey(newWeek);
    }
    window.scrollTo(0,0);
  }

  function handleWeekChange(section,val){
    const nd={...weekData,[section]:val};
    setWeekData(nd);
    saveWeek(weekKey,nd);
    setSaved(true);
    setTimeout(()=>setSaved(false),1500);
  }

  function switchWeek(){
    const key=getWeekKey(modalDate);
    setWeekKey(key);
    setCurrentDate(key);
    setShowModal(false);
    window.scrollTo(0,0);
  }

  async function handleMigrate(){
    setMigrating(true);
    setMigrateMsg('Migrating...');
    const{count,errors}=await migrateToCloud();
    setMigrateMsg(errors.length?`✓ ${count} migrated, ${errors.length} errors — check console`:`✓ Migrated ${count} records to cloud`);
    setMigrating(false);
    // Reload current week from cloud
    loadWeek(weekKey).then(d=>setWeekData(d));
    loadDay(currentDate).then(d=>setDailyData(d));
  }

  const switchTab=t=>{setTab(t);window.scrollTo(0,0);};

  return e('div',null,
    e('div',{className:'app-header'},
      e('div',{className:'header-top'},
        e('div',null,
          e('div',{className:'app-title'},'PROJECT 11'),
          e('div',{className:'app-sub'},'Area Manager · Eastern WI')
        ),
        e('div',{className:'header-right'},
          e('button',{className:'week-btn',onClick:()=>setShowModal(true)},'📅 Week of '+fmtWeek(weekKey)),
          saved&&e('div',{className:'saved-tag'},'✓ SAVED')
        )
      ),
      e('div',{className:'gold-bar'}),
      e('div',{className:'tabs'},
        e('div',{className:`tab ${tab==='today'?'active':''}`,onClick:()=>switchTab('today')},'Today'),
        e('div',{className:`tab ${tab==='scorecard'?'active':''}`,onClick:()=>switchTab('scorecard')},
          'Scorecard',alerts.length>0&&e('span',{className:'notif-badge'},alerts.length)
        ),
        e('div',{className:`tab ${tab==='weekly'?'active':''}`,onClick:()=>switchTab('weekly')},'Weekly'),
        e('div',{className:`tab ${tab==='daily'?'active':''}`,onClick:()=>switchTab('daily')},'Daily')
      )
    ),
    e('div',{className:'content'},
      tab==='today'&&(!weekData||!dailyData
        ?e('div',{style:{padding:'40px',textAlign:'center',fontFamily:"'Barlow',sans-serif",color:'var(--gray)'}},'Loading...')
        :e(TodayTab,{
          currentDate,
          dl:dailyData,
          onDlChange:nd=>{setDailyData(nd);saveDay(currentDate,nd);setSaved(true);setTimeout(()=>setSaved(false),1500);},
          sc:weekData.sc,
          wkDays:weekData.wk.days,
          weekKey,
          onSwitchTab:switchTab
        })
      ),
      !weekData&&tab!=='today'&&e('div',{style:{padding:'40px',textAlign:'center',fontFamily:"'Barlow',sans-serif",color:'var(--gray)'}},'Loading...'),
      tab==='scorecard'&&weekData&&e(ScorecardTab,{sc:weekData.sc,onChange:v=>handleWeekChange('sc',v),weekKey}),
      tab==='weekly'&&weekData&&e(WeeklyTab,{
        wk:weekData.wk,
        onChange:v=>handleWeekChange('wk',v),
        weekKey,
        areaPri:weekData.sc.areaPri,
        onAreaPriChange:v=>handleWeekChange('sc',{...weekData.sc,areaPri:v})
      }),
      tab==='daily'&&weekData&&weekData.wk&&e(DailyTab,{currentDate,onDateChange:handleDateChange,wkDays:weekData.wk.days||{}})
    ),
    showModal&&e('div',{className:'modal-bg',onClick:ev=>ev.target.className==='modal-bg'&&setShowModal(false)},
      e('div',{className:'modal'},
        e('h3',null,'Select Week'),
        e('input',{type:'date',value:modalDate,onChange:ev=>setModalDate(ev.target.value)}),
        e('div',{className:'modal-btns'},
          e('button',{className:'btn btn-s',onClick:()=>setShowModal(false)},'Cancel'),
          e('button',{className:'btn btn-p',onClick:switchWeek},'Go')
        ),
        e('div',{style:{marginTop:'14px',borderTop:'1px solid #eee',paddingTop:'14px'}},
          migrateMsg
            ?e('div',{style:{fontFamily:"'Barlow',sans-serif",fontSize:'12px',color:'var(--green)',textAlign:'center',padding:'6px'}},migrateMsg)
            :e('button',{className:'btn btn-s',style:{width:'100%',fontSize:'11px'},onClick:handleMigrate,disabled:migrating},
              migrating?'Migrating...':'⬆ Migrate Local Data to Cloud'
            )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
